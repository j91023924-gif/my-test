<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기소개</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #dbeafe;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      text-align: center;
    }
    h1 { margin-top: 0; }
    ul { text-align: left; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>안녕하세요! 👋</h1>
    <p>저는 <strong>홍길동</strong>입니다.</p>
    <p>새로운 것을 배우고 만드는 것을 좋아합니다.</p>
    <ul>
      <li>취미: 독서, 산책</li>
      <li>관심사: 웹 개발</li>
      <li>이메일: example@email.com</li>
    </ul>
  </div>
</body>
</html>
